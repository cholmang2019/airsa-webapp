```yaml
name: Deploy Vite App to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          echo "===== NODE VERSION ====="
          node --version

          echo "===== NPM VERSION ====="
          npm --version

          echo "===== INSTALLED PACKAGES ====="
          npm list vite vite-plugin-pwa @vitejs/plugin-react @tailwindcss/vite --depth=0 || true

          echo "===== PACKAGE JSON ====="
          cat package.json

          echo "===== VITE CONFIG ====="
          cat vite.config.ts

          echo "===== RUNNING BUILD ====="
          npm run build

      - name: Verify dist
        run: |
          echo "===== DIST CONTENT ====="
          ls -la dist

          echo "===== DIST INDEX ====="
          cat dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```
